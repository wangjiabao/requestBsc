    uint64 createdBlockNumber = 25;
    uint64 enteredBlockNumber = 26;
    uint64 exitedBlockNumber = 27;
    uint64 lastSyncedBlock = 28;
    uint64 createdAt = 29;
    uint64 updatedAt = 30;
  }
