    string rewardRecommendExpired = 20;
    string lineU = 21;
    string lineCoinU = 22;
    string lineCoin = 23;
    string lineFee = 24;
    string levelReward = 25;
    uint64 createdAt = 26;
    uint64 updatedAt = 27;
